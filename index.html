<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>منصة الحل التلقائي</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-page: #070406;
      --bg-card: #12080b;
      --bg-input: #1b0d12;
      --bg-log: #070506;
      --border-card: #3b111c;
      --border-input: #4d1725;
      --red-main: #ff2e4c;
      --red-glow: rgba(255, 46, 76, 0.32);
      --text-main: #f8fafc;
      --text-muted: #a88b93;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', system-ui, -apple-system, sans-serif;
    }

    body {
      background: radial-gradient(circle at top, #1f070e 0%, var(--bg-page) 68%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 20px 14px 40px;
    }

    .wrap {
      width: 100%;
      max-width: 520px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .brand-title {
      font-size: 1.55rem;
      font-weight: 900;
      color: var(--red-main);
      letter-spacing: 0.5px;
      text-shadow: 0 0 22px var(--red-glow);
    }

    .top-badges {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .pill-btn {
      background: #1a0b10;
      border: 1px solid #4c1726;
      color: #fecdd3;
      font-size: 0.78rem;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .pill-btn:hover {
      border-color: var(--red-main);
      background: #280e16;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 18px;
      padding: 20px 18px;
      margin-bottom: 14px;
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.65);
    }

    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .card-head h2 {
      font-size: 1.05rem;
      font-weight: 800;
      color: #fff1f2;
    }

    .status-badge {
      background: #270c13;
      border: 1px solid #5c192b;
      color: #fda4af;
      font-size: 0.76rem;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 999px;
    }

    .status-badge.active {
      background: #380b16;
      border-color: var(--red-main);
      color: #ff6b81;
      box-shadow: 0 0 14px var(--red-glow);
    }

    .field {
      margin-bottom: 12px;
    }

    .field label {
      display: block;
      font-size: 0.82rem;
      font-weight: 700;
      color: #e2c8cf;
      margin-bottom: 6px;
    }

    .control {
      width: 100%;
      height: 44px;
      background: var(--bg-input);
      border: 1px solid var(--border-input);
      border-radius: 11px;
      padding: 0 13px;
      color: #ffffff;
      font-size: 0.9rem;
      outline: none;
    }

    .control:focus {
      border-color: var(--red-main);
      box-shadow: 0 0 0 3px rgba(255, 46, 76, 0.16);
    }

    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .actions {
      display: grid;
      grid-template-columns: 1.6fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }

    .btn {
      height: 44px;
      border-radius: 11px;
      font-size: 0.92rem;
      font-weight: 800;
      cursor: pointer;
      border: none;
      transition: 0.15s ease;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-run {
      background: linear-gradient(90deg, #e11d48 0%, #ff2e4c 100%);
      color: #ffffff;
      box-shadow: 0 6px 20px rgba(255, 46, 76, 0.35);
    }

    .btn-stop {
      background: #291017;
      border: 1px solid #5c192b;
      color: #fda4af;
    }

    .solve-title {
      font-size: 1.05rem;
      font-weight: 800;
      color: #ffe4e6;
      margin-bottom: 8px;
    }

    .progress-track {
      width: 100%;
      height: 8px;
      background: #260d14;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #be123c, #ff2e4c);
      border-radius: 999px;
      transition: width 0.25s ease;
      box-shadow: 0 0 12px var(--red-glow);
    }

    .log-stream {
      background: var(--bg-log);
      border: 1px solid #2b1018;
      border-radius: 12px;
      padding: 12px 14px;
      max-height: 290px;
      overflow-y: auto;
      font-size: 0.9rem;
      line-height: 1.75;
      color: #f1f5f9;
      direction: rtl;
      text-align: right;
    }

    .log-line {
      padding: 1px 0;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .admin-box {
      display: none;
      margin-top: 12px;
      background: #17090e;
      border: 1px solid #4d1725;
      border-radius: 14px;
      padding: 14px;
    }

    .admin-box.open {
      display: block;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .stat-item {
      background: #0d0508;
      border: 1px solid #33101a;
      border-radius: 10px;
      padding: 10px 8px;
      text-align: center;
    }

    .stat-num {
      font-size: 1.15rem;
      font-weight: 900;
      color: var(--red-main);
    }

    .stat-lbl {
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .users-table-wrap {
      max-height: 210px;
      overflow-y: auto;
      border-radius: 10px;
      border: 1px solid #2b1018;
      background: #090406;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.76rem;
    }

    th, td {
      padding: 7px 8px;
      border-bottom: 1px solid #1e0b11;
      text-align: right;
      color: #e2e8f0;
    }

    th {
      background: #18090e;
      color: #fda4af;
      position: sticky;
      top: 0;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top-bar">
      <div class="brand-title">QUREO AUTO SOLVER</div>
      <div class="top-badges">
        <button class="pill-btn" onclick="toggleAdminPanel()">👥 المسجلون: <span id="regCountBadge">0</span></button>
      </div>
    </div>

    <div id="adminPanel" class="admin-box">
      <div class="stats-grid">
        <div class="stat-item">
          <div id="stTotalUsers" class="stat-num">0</div>
          <div class="stat-lbl">إجمالي المسجلين</div>
        </div>
        <div class="stat-item">
          <div id="stActiveStudents" class="stat-num">0</div>
          <div class="stat-lbl">حسابات دخلت</div>
        </div>
        <div class="stat-item">
          <div id="stTotalSolves" class="stat-num">0</div>
          <div class="stat-lbl">عمليات الحل</div>
        </div>
      </div>
      <div class="users-table-wrap">
        <table>
          <thead>
            <tr>
              <th>الاسم</th>
              <th>كود الطالب</th>
              <th>الحلول</th>
              <th>آخر نشاط</th>
            </tr>
          </thead>
          <tbody id="usersTableBody">
            <tr><td colspan="4" style="text-align:center;color:#94a3b8;">جاري التحميل...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <div class="card-head">
        <h2>بيانات الطالب</h2>
        <span id="statusBadge" class="status-badge">جاهز</span>
      </div>

      <div class="field">
        <label for="studentId">كود الطالب (Student ID)</label>
        <input id="studentId" class="control" type="text" placeholder="مثال: 12345678" autocomplete="off" />
      </div>

      <div class="field">
        <label for="password">كلمة المرور (Password)</label>
        <input id="password" class="control" type="password" placeholder="أدخل كلمة المرور" />
      </div>

      <div class="row-2">
        <div class="field">
          <label for="subject">المادة</label>
          <select id="subject" class="control">
            <option value="js">JavaScript</option>
            <option value="py">Python</option>
            <option value="fin">الثقافة المالية</option>
            <option value="all">جميع المواد</option>
          </select>
        </div>
        <div class="field">
          <label for="track">المسار</label>
          <select id="track" class="control">
            <option value="general">عام (عربي)</option>
            <option value="azhar">أزهر (عربي)</option>
            <option value="languages">لغات (English)</option>
          </select>
        </div>
      </div>

      <div class="actions">
        <button id="startBtn" class="btn btn-run" onclick="startSolve()">تشغيل الحل</button>
        <button id="stopBtn" class="btn btn-stop" onclick="stopSolve()" disabled>إيقاف</button>
      </div>
    </div>

    <div class="card">
      <div id="solveHeader" class="solve-title">⏳ جاري الحل</div>
      <div class="progress-track">
        <div id="progressFill" class="progress-fill"></div>
      </div>
      <div id="logStream" class="log-stream">
        <div class="log-line">... بدء الاتصال</div>
      </div>
    </div>
  </div>

  <script>
    let currentTaskId = null;
    let pollTimer = null;

    function getVisitorId() {
      let vid = localStorage.getItem('qureo_visitor_id');
      if (!vid) {
        vid = 'v_' + Math.random().toString(36).slice(2) + Date.now().toString(36);
        localStorage.setItem('qureo_visitor_id', vid);
      }
      return vid;
    }

    async function pingRegistration(studentId = '', studentName = '') {
      try {
        const res = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            visitor_id: getVisitorId(),
            student_id: studentId,
            student_name: studentName
          })
        });
        const data = await res.json();
        if (typeof data.total_registered === 'number') {
          document.getElementById('regCountBadge').textContent = data.total_registered;
        }
      } catch (e) {}
    }

    async function loadStats() {
      try {
        const res = await fetch('/api/stats');
        const data = await res.json();
        document.getElementById('regCountBadge').textContent = data.total_registered ?? 0;
        document.getElementById('stTotalUsers').textContent = data.total_registered ?? 0;
        document.getElementById('stActiveStudents').textContent = data.active_students ?? 0;
        document.getElementById('stTotalSolves').textContent = data.total_solves ?? 0;

        const tbody = document.getElementById('usersTableBody');
        if (!data.users || !data.users.length) {
          tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:#94a3b8;">لا يوجد مسجلون بعد</td></tr>';
          return;
        }
        tbody.innerHTML = data.users.map(u => `
          <tr>
            <td>${escapeHtml(u.student_name)}</td>
            <td>${escapeHtml(u.student_id)}</td>
            <td>${u.solves_count}</td>
            <td>${escapeHtml(u.last_seen)}</td>
          </tr>
        `).join('');
      } catch (e) {}
    }

    function toggleAdminPanel() {
      const box = document.getElementById('adminPanel');
      box.classList.toggle('open');
      if (box.classList.contains('open')) {
        loadStats();
      }
    }

    function escapeHtml(str) {
      return String(str || '').replace(/[&<>"']/g, s => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[s]));
    }

    function renderLogs(logs) {
      const box = document.getElementById('logStream');
      if (!logs || !logs.length) return;
      box.innerHTML = logs.map(line => `<div class="log-line">${escapeHtml(line)}</div>`).join('');
      box.scrollTop = box.scrollHeight;
    }

    async function startSolve() {
      const student_id = document.getElementById('studentId').value.trim();
      const password = document.getElementById('password').value.trim();
      const subject = document.getElementById('subject').value;
      const track = document.getElementById('track').value;

      if (!student_id || !password) {
        renderLogs(['... بدء الاتصال', '❌ يرجى إدخال كود الطالب وكلمة المرور']);
        return;
      }

      document.getElementById('startBtn').disabled = true;
      document.getElementById('stopBtn').disabled = false;
      const badge = document.getElementById('statusBadge');
      badge.textContent = 'جاري الحل';
      badge.classList.add('active');
      document.getElementById('solveHeader').textContent = '⏳ جاري الحل';
      renderLogs(['... بدء الاتصال']);

      try {
        const res = await fetch('/api/start', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            visitor_id: getVisitorId(),
            student_id,
            password,
            subject,
            track
          })
        });
        const data = await res.json();
        if (!res.ok || !data.task_id) {
          throw new Error(data.error || 'فشل بدء العملية');
        }
        currentTaskId = data.task_id;
        if (pollTimer) clearInterval(pollTimer);
        pollTimer = setInterval(pollStatus, 650);
      } catch (err) {
        renderLogs(['... بدء الاتصال', '❌ ' + err.message]);
        document.getElementById('startBtn').disabled = false;
        document.getElementById('stopBtn').disabled = true;
        badge.textContent = 'خطأ';
        badge.classList.remove('active');
      }
    }

    async function stopSolve() {
      if (!currentTaskId) return;
      document.getElementById('stopBtn').disabled = true;
      await fetch('/api/stop', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ task_id: currentTaskId })
      });
    }

    async function pollStatus() {
      if (!currentTaskId) return;
      try {
        const res = await fetch('/api/status/' + currentTaskId);
        if (!res.ok) return;
        const st = await res.json();

        document.getElementById('progressFill').style.width = `${st.percent || 0}%`;
        renderLogs(st.logs || []);

        if (st.total > 0) {
          document.getElementById('solveHeader').textContent =
            st.running ? `⏳ جاري حل فصل ${st.current} من ${st.total}` : `⏳ ${st.status || 'مكتمل'}`;
        } else if (st.status) {
          document.getElementById('solveHeader').textContent = `⏳ ${st.status}`;
        }

        const badge = document.getElementById('statusBadge');
        if (st.running) {
          badge.textContent = st.badge || 'جاري الحل';
          badge.classList.add('active');
        } else {
          clearInterval(pollTimer);
          pollTimer = null;
          document.getElementById('startBtn').disabled = false;
          document.getElementById('stopBtn').disabled = true;
          badge.textContent = st.badge || 'جاهز';
          badge.classList.remove('active');
          loadStats();
        }
      } catch (e) {}
    }

    pingRegistration();
    loadStats();
  </script>
</body>
  </html>
